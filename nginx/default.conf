# In-compose proxy: host nginx (TLS) -> this container -> dashboard.
#
# Only the host proxy can reach this container (compose publishes it on
# 127.0.0.1 only), so the X-Forwarded-* headers it sends are trusted and
# passed through untouched. The app's ProxyFix trusts exactly one hop, so
# appending our own peer address to X-Forwarded-For (as $proxy_add_x_forwarded_for
# does) would make the app see the Docker gateway as the client and break
# per-address login rate limiting.

# Fall back to our own scheme when reached directly on loopback (no host proxy).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Resolve the upstream per request via Docker's embedded DNS; a literal
    # name is resolved once at startup and goes stale when the dashboard
    # restarts alone.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_dashboard http://dashboard:8080;

    client_max_body_size 1m;

    # The pages poll every 10s and carry every row, so they and the vendored
    # chart library are the bytes worth shrinking. Safe for the HTML: the
    # CSRF token in it is masked with a fresh random pad per response, so
    # the compressed size does not leak it (the BREACH precondition).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass $upstream_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;   # gunicorn --timeout is 30s
    }
}
