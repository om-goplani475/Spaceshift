name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: nothing here publishes, deploys, or comments, and
# forked PRs run this workflow with whatever it's granted.
permissions:
  contents: read

# A newer push to the same PR cancels the older run; main pushes queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image tag as docker-compose.yml, so tests run against what
      # users actually deploy. Lets tests/state/test_postgres_backend.py
      # run instead of skipping.
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (Postgres-backed tests included)
        env:
          EBS_AUTO_RESIZE_TEST_POSTGRES_DSN: dbname=testdb user=postgres password=test host=localhost port=5432
        run: pytest -q

  audit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Audits the pinned runtime set - exactly what the Docker image
      # installs. Fails the build on any known vulnerability; the set is
      # small and current, so there's nothing to grandfather.
      - run: pip-audit --requirement requirements.txt --strict
