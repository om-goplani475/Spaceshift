name: Feature request
description: Suggest a change or addition.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What are you doing today, and where does it fall short?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: If you have a specific approach in mind, describe it here. It's fine to leave this open.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you've tried, or other tools that handle this.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I've read the "out of scope for now" notes in the README (e.g. LVM volumes) and this isn't one of them, or I'm proposing how to lift that limit.
