services:
  controller:
    build: .
    restart: unless-stopped
    # No AWS keys here by default - attach an IAM role to the host running
    # this container instead (see README for the least-privilege policy).
    # Only needed for local testing without an instance role:
    # environment:
    #   - AWS_ACCESS_KEY_ID=
    #   - AWS_SECRET_ACCESS_KEY=
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - state-data:/data
      # Only needed if connection.mode: ssh in config.yaml - never bake a
      # key into the image, mount it read-only instead:
      # - ~/.ssh/ebs-auto-resize-key.pem:/home/controller/.ssh/id_rsa:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional status page - not started by a plain `docker compose up`.
  # Run with: docker compose --profile dashboard up
  dashboard:
    build: .
    command: ["python", "-m", "controller.dashboard"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - state-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - dashboard

volumes:
  state-data:
