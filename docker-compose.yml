services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebs_auto_resize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
      POSTGRES_DB: ebs_auto_resize
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebs_auto_resize"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Not published to the host by default - only the controller/dashboard
    # containers need to reach it, over the compose network. Uncomment to
    # inspect it directly with a local psql client:
    # ports:
    #   - "5432:5432"

  controller:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Must match the postgres service's password above - same variable,
      # so the two never disagree without extra config.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
      # Slack alerts (optional) - the channel and method are set on the
      # dashboard; only the secret lives here.
      SPACESHIFT_SLACK_BOT_TOKEN: ${SPACESHIFT_SLACK_BOT_TOKEN:-}
      # Only when the host has no instance role (see docs/SETUP.md 1.1).
      # Empty values are ignored by boto3's credential chain.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    # No AWS keys here by default - attach an IAM role to the host running
    # this container (see docs/SETUP.md) and boto3 picks it up with zero
    # config. Without an instance role, set AWS_ACCESS_KEY_ID and
    # AWS_SECRET_ACCESS_KEY in .env (passed through below).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Status page - starts automatically with a plain `docker compose up`,
  # same as controller/postgres. No `profiles:` gate (there used to be one,
  # requiring `--profile dashboard`) - not worth the extra flag to type
  # every time for a container this cheap to run alongside the others.
  dashboard:
    build: .
    # gunicorn, not Flask's dev server. 2 workers x 4 threads is plenty for
    # a status page polled every 10s per open tab; each worker has its own
    # Postgres pool. No --preload (see controller/dashboard/wsgi.py).
    # Access logs are off: the 10s poll would make them pure noise.
    command:
      - gunicorn
      - --bind=0.0.0.0:8080
      - --workers=2
      - --threads=4
      - --timeout=30
      - --graceful-timeout=10
      - controller.dashboard.wsgi:app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
      # Signs session cookies. Required - see .env.example for how to
      # generate one. Rotating it signs everyone out.
      SPACESHIFT_SECRET_KEY: ${SPACESHIFT_SECRET_KEY:?Set SPACESHIFT_SECRET_KEY in .env - see .env.example}
      # Guards /setup, the page that creates the first admin. Optional:
      # unset, /setup only prints instructions and the CLI is the way in.
      SPACESHIFT_SETUP_TOKEN: ${SPACESHIFT_SETUP_TOKEN:-}
      # "true" only when an HTTPS reverse proxy sits in front - turns on
      # Secure cookies and trusts X-Forwarded-* from one hop.
      SPACESHIFT_BEHIND_TLS_PROXY: ${SPACESHIFT_BEHIND_TLS_PROXY:-false}
      # For the Settings page's "Send test notification" button only. The
      # dashboard holds no AWS credentials - account checks run in the
      # controller.
      SPACESHIFT_SLACK_BOT_TOKEN: ${SPACESHIFT_SLACK_BOT_TOKEN:-}
    # Loopback only: the host's TLS reverse proxy (nginx/Caddy) is the sole
    # way in. Docker publishes ports past host firewalls (ufw), so a bare
    # "8089:8080" would expose plain-HTTP login on every interface.
    ports:
      - "127.0.0.1:8089:8080"
    # Overrides the Dockerfile's baked-in HEALTHCHECK, which checks for a
    # heartbeat file only Scheduler.run_forever() ever writes - this
    # service runs the dashboard instead (no scheduler loop), so that file
    # never exists here and the image's default healthcheck would report
    # unhealthy forever regardless of whether the dashboard is actually
    # working. /healthz is unauthenticated and runs SELECT 1, so this
    # proves the process is up *and* Postgres answers - no curl/wget in
    # the slim base image, so plain urllib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
