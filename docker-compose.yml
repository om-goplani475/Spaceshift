services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebs_auto_resize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
      POSTGRES_DB: ebs_auto_resize
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebs_auto_resize"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Not published to the host by default - only the controller/dashboard
    # containers need to reach it, over the compose network. Uncomment to
    # inspect it directly with a local psql client:
    # ports:
    #   - "5432:5432"

  controller:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Must match the postgres service's password above - same variable,
      # so the two never disagree without extra config.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
    # No AWS keys here - attach an IAM role to the host running this
    # container instead (see docs/SETUP.md), and boto3 picks it up
    # automatically with zero config. If no instance role is available
    # (your own server, another cloud, etc), set credentials.mode: static
    # and the access key in config.yaml instead - see docs/SETUP.md.
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional status page - not started by a plain `docker compose up`.
  # Run with: docker compose --profile dashboard up
  dashboard:
    build: .
    command: ["python", "-m", "controller.dashboard"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
    ports:
      - "8089:8080"
    # Overrides the Dockerfile's baked-in HEALTHCHECK, which checks for a
    # heartbeat file only Scheduler.run_forever() ever writes - this
    # service runs `controller.dashboard` instead (a plain Flask app, no
    # scheduler loop), so that file never exists here and the image's
    # default healthcheck would report unhealthy forever regardless of
    # whether the dashboard is actually working. Checks the page itself
    # instead - no curl/wget in the slim base image, so plain urllib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - dashboard

volumes:
  postgres-data:
