[project]
name = "ebs-auto-resize"
version = "0.1.0"
description = "Self-hosted controller that auto-resizes EBS volumes (AWS-side and OS-side) based on real disk usage"
requires-python = ">=3.12"

# Dependencies live in requirements.txt (runtime, fully pinned - what the
# Dockerfile installs) and requirements-dev.txt (test/lint tooling, what a
# contributor installs) - not duplicated here, since this project ships as
# a container, not a published package.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (common bug patterns)
]
