<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · Spaceshift</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('overview') }}">Spaceshift</a>
    <nav class="nav" aria-label="Main">
      {% for endpoint, label in nav_items %}
      <a href="{{ url_for(endpoint) }}" class="nav-link{% if request.endpoint == endpoint %} is-active{% endif %}"
         {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <div class="live" id="live-indicator" data-state="idle" title="This page refreshes itself every 10 seconds while visible">
      <span class="live-dot" aria-hidden="true"></span>
      <span class="live-label">Live</span>
      <span class="live-age" id="live-age"></span>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-header">
    <h1>{% block heading %}{% endblock %}</h1>
    {% block lede %}{% endblock %}
  </div>
  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
