{% extends "base.html" %}
{% from "_macros.html" import filter_select, pager, empty_row, usage_meter, copy_button, search_input with context %}

{% block title %}Dashboard{% endblock %}
{# ApexCharts builds this stylesheet in a <style> tag at runtime, which the CSP blocks - served as a file instead. #}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/vendor/apexcharts.css') }}">{% endblock %}
{% block heading %}Dashboard{% endblock %}
{% block lede %}<p class="lede">What needs attention, what is resizing, and what the controller has done.</p>{% endblock %}

{% block content %}
{% if dry_run %}
<div class="banner-dryrun" role="status">
  <span class="banner-icon" aria-hidden="true">
    <svg class="icon" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
  </span>
  <div><strong>Dry run is on.</strong> <p>The controller only logs what it would resize. Nothing in AWS or on any filesystem changes. <a href="{{ url_for('settings') }}">Turn it off in Settings</a> when the logs look right.</p></div>
</div>
{% endif %}

<div class="kpi-grid" id="dashboard-stats">
  <div class="kpi-card {{ 'warn' if stats.needs_attention }}">
    <div class="kpi-top"><span class="l kpi-label">Needs attention</span></div>
    <div class="n kpi-value">{{ stats.needs_attention }}</div>
  </div>
  <div class="kpi-card {{ 'live-now' if stats.in_progress }}">
    <div class="kpi-top"><span class="l kpi-label">In progress</span></div>
    <div class="n kpi-value">{{ stats.in_progress }}</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-top"><span class="l kpi-label">Volumes scanned</span></div>
    <div class="n kpi-value">{{ stats.tracked }}</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-top"><span class="l kpi-label">Autoresize enabled</span></div>
    <div class="n kpi-value">{{ stats.autoresize_enabled }}</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-top"><span class="l kpi-label">Resizes completed</span></div>
    <div class="n kpi-value">{{ stats.completed }}</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-top"><span class="l kpi-label">Managed storage</span></div>
    <div class="n kpi-value">{{ "{:,}".format(stats.total_gb) }}<span class="kpi-unit">GB</span></div>
  </div>
  <div class="kpi-card">
    <div class="kpi-top"><span class="l kpi-label">Est. monthly EBS spend</span></div>
    {% if monthly_cost is not none %}
    <div class="n kpi-value">{{ "~" if monthly_cost_is_partial else "" }}${{ "{:,.2f}".format(monthly_cost) }}</div>
    <p class="kpi-sub">AWS list pricing{{ ", some volumes excluded" if monthly_cost_is_partial else "" }}</p>
    {% else %}
    <div class="n kpi-value">&mdash;</div>
    <p class="kpi-sub">AWS list pricing</p>
    {% endif %}
  </div>
</div>

<section class="section">
  <div class="section-header">
    <h2>Bay plan</h2>
    <p class="section-note">One cell per volume, filled to how full it is. Fullest and mid-resize volumes come first.</p>
  </div>
  <div class="bay-plan">
    <div class="bay-head">
      <div class="bay-key" aria-hidden="true">
        <span><i class="dot-gray"></i>Under 70%</span>
        <span><i class="dot-amber"></i>70% to 85%</span>
        <span><i class="dot-red"></i>Over 85%</span>
        <span><i class="dot-blue"></i>In progress</span>
      </div>
    </div>
    {% if bay_cells %}
    <ul class="bay-grid" aria-label="Volumes by how full they are">
      {% for c in bay_cells %}
      <li><a class="bay-cell{{ ' is-resizing' if c.resizing }}" href="{{ url_for('volumes') }}" data-level="{{ c.level }}"
         title="{{ c.name }}: {{ c.pct ~ '% used' if c.pct is not none else 'no usage reading yet' }}{{ ', resizing now' if c.resizing }}"
         aria-label="{{ c.name }}, {{ c.pct ~ '% used' if c.pct is not none else 'no usage reading yet' }}{{ ' (over 85%)' if c.level == 'critical' }}{{ ' (70% to 85%)' if c.level == 'warning' }}{{ ', resizing now' if c.resizing }}">
        <span class="bay-fill p{{ c.fill }}"></span>
        <span class="bay-code">{{ c.code }}</span>
        <span class="bay-pct">{{ c.pct ~ "%" if c.pct is not none else "–" }}</span>
      </a></li>
      {% endfor %}
    </ul>
    {% if bay_hidden %}<p class="section-note">{{ bay_hidden }} more volume{{ "s" if bay_hidden != 1 }} not shown. Open Volumes for the full list.</p>{% endif %}
    {% else %}
    <p class="bay-empty">No volumes scanned yet. The first cycle runs shortly after the controller starts.</p>
    {% endif %}
  </div>
</section>

<section class="section">
  <div class="section-header">
    <h2>Fleet usage and resize outcomes</h2>
    <p class="section-note">How full the scanned volumes are, and where each resize ended up.</p>
  </div>
  <div class="charts-grid">
    <div class="chart-card">
      <h2>Usage breakdown</h2>
      <div id="chart-usage" class="chart-canvas" data-breakdown='{{ storage_breakdown | tojson }}'></div>
      <div class="chart-legend">
        <span><i class="dot-green"></i>Healthy &lt;70%</span>
        <span><i class="dot-amber"></i>Warning 70-85%</span>
        <span><i class="dot-red"></i>Critical &gt;85%</span>
      </div>
    </div>
    <div class="chart-card">
      <h2>Resize activity</h2>
      <div id="chart-activity" class="chart-canvas" data-activity='{{ resize_activity | tojson }}'></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="section-header">
    <h2>Resize activity</h2>
    <p class="section-note">Every resize the controller has started, and where it got to. Click a row for details.</p>
  </div>
  <div class="filters">
    {{ search_input("resize-search", "Search volume or instance ID…") }}
    {{ filter_select("resize-status-filter", "status", "All statuses", resize_statuses) }}
    <span class="count" id="resize-count"></span>
    <button type="button" class="btn btn-quiet export-csv-btn" data-table="resize-table" data-filename="spaceshift-resizes.csv" title="Export resizes to CSV">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export CSV
    </button>
  </div>
  <div class="active-filters-bar" id="resize-active-filters"></div>
  <div class="panel">
    <table id="resize-table">
      <thead><tr>
        <th>Volume</th><th>Instance</th><th>Status</th><th class="num">Size</th>
        <th class="num">Extend attempts</th><th>Updated</th>{% if recoverable %}<th class="action-col">Recover</th>{% endif %}
      </tr></thead>
      <tbody id="resize-tbody">
      {% for r in records %}
      <tr data-volume="{{ r.volume_id|lower }}" data-instance="{{ r.instance_id|lower }}" data-status="{{ r.status.value }}">
        <td class="mono"><span class="copyable-cell"><span>{{ r.volume_id }}</span>{{ copy_button(r.volume_id) }}</span></td>
        <td class="mono"><span class="copyable-cell"><span>{{ r.instance_id }}</span>{{ copy_button(r.instance_id) }}</span></td>
        <td><span class="badge {{ status_badge(r.status) }}">{{ r.status.value }}</span></td>
        <td class="num">{{ r.from_size_gb }} GB &rarr; {{ r.to_size_gb }} GB{% if r.volume_id in resize_cost_deltas %} <span class="cost-delta">{{ resize_cost_deltas[r.volume_id] }}</span>{% endif %}</td>
        <td class="num">{{ r.extend_attempts }}</td>
        <td class="ts" data-ts="{{ r.updated_at.isoformat() }}"></td>
        {% if recoverable %}
        <td class="action-col">
          {% if r.volume_id in recoverable %}
          <div class="row-actions">
            <form method="post" action="{{ url_for('resizes.retry_extend', volume_id=r.volume_id) }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="btn" title="Re-run only the filesystem extend on the instance. Run this after fixing what broke it.">Retry extend</button>
            </form>
            <form method="post" action="{{ url_for('resizes.mark_resolved', volume_id=r.volume_id) }}"
                  data-confirm="Only do this if you have already extended the filesystem on the instance by hand. If you have not, the volume is still full and a new resize will start. Continue?">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button type="submit" class="btn btn-quiet" title="You extended the filesystem yourself - stop tracking this failure.">Mark resolved</button>
            </form>
          </div>
          {% endif %}
        </td>
        {% endif %}
      </tr>
      {% else %}
      {{ empty_row(7 if recoverable else 6, "No resize activity yet.", "Resizes appear here once a watched volume crosses its threshold.") }}
      {% endfor %}
      </tbody>
    </table>
  </div>
  {{ pager("resize-pager") }}
</section>

<section class="section">
  <div class="section-header">
    <h2>Scan history</h2>
    <p class="section-note">The most recent {{ scan_limit }} disk checks, newest first. Click a row for details.</p>
  </div>
  <div class="filters">
    {{ search_input("scan-search", "Search volume or instance…") }}
    {{ filter_select("scan-account-filter", "account", "All accounts", scan_accounts) }}
    {{ filter_select("scan-region-filter", "region", "All regions", scan_regions) }}
    {{ filter_select("scan-size-filter", "size", "All sizes", scan_sizes, suffix=" GB") }}
    {{ filter_select("scan-decision-filter", "decision", "All decisions", scan_decisions) }}
    <span class="count" id="scan-count"></span>
    <button type="button" class="btn btn-quiet export-csv-btn" data-table="scan-table" data-filename="spaceshift-scans.csv" title="Export scans to CSV">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export CSV
    </button>
  </div>
  <div class="active-filters-bar" id="scan-active-filters"></div>
  <div class="panel">
    <table id="scan-table">
      <thead><tr>
        <th>Volume</th><th>Instance</th><th>Account</th><th>Region</th><th class="num">Size</th>
        <th class="num">Usage</th><th class="num">Threshold</th><th>Decision</th><th>Checked</th>
      </tr></thead>
      <tbody id="scan-tbody">
      {% for s in scans %}
      <tr data-volume="{{ s.volume_id|lower }}" data-instance="{{ s.instance_id|lower }}"
          data-account="{{ s.account_name }}" data-region="{{ s.region }}" data-size="{{ s.size_gb }}"
          data-decision="{{ s.decision }}">
        <td{% if s.volume_id not in volume_names %} class="mono"{% endif %} data-id="{{ s.volume_id }}">{{ volume_names.get(s.volume_id, s.volume_id) }}</td>
        <td{% if s.instance_id not in instance_names %} class="mono"{% endif %}>{{ instance_names.get(s.instance_id, s.instance_id) }}</td>
        <td>{{ s.account_name }}</td>
        <td>{{ s.region }}</td>
        <td class="num">{{ s.size_gb }} GB</td>
        <td class="num">{{ usage_meter(s.percent_used) }}</td>
        <td class="num">{{ s.threshold_percent }}%</td>
        <td><span class="badge {{ decision_badge(s.decision) }}" title="{{ decision_hint(s.decision) }}">{{ s.decision }}</span></td>
        <td class="ts" data-ts="{{ s.timestamp.isoformat() }}"></td>
      </tr>
      {% else %}
      {{ empty_row(9, "No scans recorded yet.", "The first cycle runs shortly after the controller starts.") }}
      {% endfor %}
      </tbody>
    </table>
  </div>
  {{ pager("scan-pager") }}
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/vendor/apexcharts.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/overview-charts.js') }}?v=3.5.1"></script>
{% endblock %}
